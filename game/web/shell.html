<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0a0506">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- Daywalker web shell (R2-A): the house loading screen with a real progress bar,
		     a "rotate your phone" overlay in portrait on touch devices, and a landscape lock
		     (fullscreen + screen.orientation.lock) on the first tap where the browser allows it. -->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e8ded0;
	background-color: #0a0506;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
	font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 50% 40%, #2a0d10 0%, #120708 55%, #070304 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 2;
}

#dw-title {
	font-size: clamp(36px, 9vw, 96px);
	font-weight: 700;
	letter-spacing: 0.06em;
	color: #c80f17;
	text-shadow: 0 0 24px rgba(160, 0, 10, 0.45), 0 2px 0 #1a0002;
	margin: 0;
	line-height: 1;
}

#dw-sub {
	font-size: clamp(12px, 2.2vw, 22px);
	letter-spacing: 0.5em;
	color: #e8ded0;
	margin: 0.6em 0 2.2em 0.5em;
}

#dw-bar {
	width: min(60vw, 520px);
	height: 6px;
	border: 1px solid #8c6b38;
	background: rgba(0, 0, 0, 0.6);
	position: relative;
	overflow: hidden;
}

#dw-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	background: linear-gradient(90deg, #6e0408, #d4141c);
	box-shadow: 0 0 10px rgba(220, 20, 28, 0.7);
	transition: width 0.25s linear;
}

#dw-fill.indeterminate {
	width: 30%;
	animation: dw-slide 1.4s ease-in-out infinite;
}

@keyframes dw-slide {
	0% { left: -30%; }
	100% { left: 100%; }
}

#dw-text {
	margin-top: 0.9em;
	font-size: clamp(12px, 1.8vw, 17px);
	color: #a0958a;
	letter-spacing: 0.08em;
	min-height: 1.3em;
}

#status-notice {
	display: none;
	background-color: #3b1418;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 1.5rem 2rem 0;
	padding: 1rem;
	text-align: center;
}

#dw-rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	background: #0a0506;
	color: #e8ded0;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	font-size: 22px;
	padding: 0 2rem;
}

#dw-rotate .icon {
	width: 54px;
	height: 92px;
	border: 3px solid #c80f17;
	border-radius: 9px;
	margin-bottom: 1.4rem;
	animation: dw-turn 2.2s ease-in-out infinite;
}

#dw-rotate small {
	display: block;
	margin-top: 0.6em;
	color: #a0958a;
	font-size: 15px;
}

@keyframes dw-turn {
	0%, 25% { transform: rotate(0deg); }
	55%, 100% { transform: rotate(-90deg); }
}

/* phones and tablets held upright: the Hunt is landscape only */
@media (orientation: portrait) and (pointer: coarse) {
	#dw-rotate { display: flex; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<h1 id="dw-title">DAYWALKER</h1>
			<div id="dw-sub">BLOOD AND MOON</div>
			<div id="dw-bar"><div id="dw-fill" class="indeterminate"></div></div>
			<div id="dw-text">Waking the Undercroft&hellip;</div>
			<div id="status-notice"></div>
		</div>

		<div id="dw-rotate">
			<div class="icon"></div>
			Turn your phone sideways
			<small>The hunt is played in landscape.</small>
		</div>

		<script>
// Audio unlock. Browsers start an AudioContext "suspended" until a user gesture, and iOS also
// needs a sound started inside a touchend. The engine resumes on its own input, but a gesture
// the canvas never sees (the rotate overlay, the fullscreen/landscape tap) or a context that
// the OS interrupted (phone call, app switch) would leave the game silent. So: keep every
// AudioContext the engine makes, and on every gesture resume the ones not "running" and play
// one silent sample. Also put iOS in "playback" mode so the ring/silent switch doesn't mute it.
(function () {
	const Base = window.AudioContext || window.webkitAudioContext;
	if (!Base) {
		return;
	}
	const contexts = [];
	class TrackedAudioContext extends Base {
		constructor(opts) {
			super(opts);
			contexts.push(this);
		}
	}
	window.AudioContext = TrackedAudioContext;
	if (window.webkitAudioContext) {
		window.webkitAudioContext = TrackedAudioContext;
	}
	try {
		if (navigator.audioSession) {
			navigator.audioSession.type = 'playback';
		}
	} catch (e) { /* not supported */ }
	const unlock = function () {
		contexts.forEach(function (ctx) {
			if (ctx.state === 'running' || ctx.state === 'closed') {
				return;
			}
			ctx.resume().catch(function () {});
			try {
				const src = ctx.createBufferSource();
				src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
				src.connect(ctx.destination);
				src.start(0);
			} catch (e) { /* ignore */ }
		});
	};
	['pointerdown', 'mousedown', 'touchstart', 'touchend', 'keydown', 'click'].forEach(function (type) {
		window.addEventListener(type, unlock, { capture: true, passive: true });
	});
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) {
			unlock();
		}
	});
	window.dwAudioContexts = contexts; // for debugging / the CI audio check
}());
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// Landscape lock: browsers only allow it in fullscreen, and only from a user gesture.
(function () {
	const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
	if (!coarse) {
		return;
	}
	let tried = false;
	const lock = function () {
		if (tried) {
			return;
		}
		tried = true;
		const el = document.documentElement;
		const fs = el.requestFullscreen || el.webkitRequestFullscreen;
		const after = function () {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function () {});
			}
		};
		try {
			const p = fs ? fs.call(el, { navigationUI: 'hide' }) : null;
			if (p && p.then) {
				p.then(after, after);
			} else {
				after();
			}
		} catch (e) {
			after();
		}
	};
	window.addEventListener('touchend', lock, { passive: true });
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const fill = document.getElementById('dw-fill');
	const text = document.getElementById('dw-text');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;

	function hideStatus() {
		if (!initializing) {
			return;
		}
		initializing = false;
		statusOverlay.remove();
	}

	function displayFailureNotice(err) {
		console.error(err);
		let msg = 'An unknown error occured';
		if (err instanceof Error) {
			msg = err.message;
		} else if (typeof err === 'string') {
			msg = err;
		}
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		msg.split('\n').forEach(function (line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
		statusOverlay.style.visibility = 'visible';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		return;
	}
	statusOverlay.style.visibility = 'visible';
	const mb = function (b) {
		return (b / 1048576).toFixed(1);
	};
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.floor((current / total) * 100));
				fill.classList.remove('indeterminate');
				fill.style.width = pct + '%';
				text.textContent = pct >= 100 ? 'Lighting the candles…' : ('Loading  ' + pct + '%   ·   ' + mb(current) + ' / ' + mb(total) + ' MB');
			} else {
				fill.classList.add('indeterminate');
			}
		},
	}).then(hideStatus, displayFailureNotice);
}());
		</script>
	</body>
</html>
