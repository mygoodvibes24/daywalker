name: Build & deploy web game

on:
  push:
    branches: [main, claude/day-walker-game-concept-mz8vvv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d $dest
      - name: Export Web build
        run: |
          mkdir -p build/web
          cd game
          ../Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import . || true
          ../Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" ../build/web/index.html
          test -f ../build/web/index.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
