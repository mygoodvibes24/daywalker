name: Build & deploy web game

on:
  push:
    branches: [main, claude/day-walker-game-concept-mz8vvv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot + web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Install Godot + web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -d ~/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d $dest
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz
      - name: Import project
        # .godot/ is not committed, so this is always a fresh import with the .import settings
        # in the repo (web-safe Lossy/WebP character and prop textures, ETC2/ASTC enabled).
        working-directory: game
        run: |
          rm -rf .godot
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import .
          if grep -rl "compress/mode=2" --include=*.import assets/characters assets/props; then
            echo "::error::VRAM-compressed character/prop textures do not load on phone browsers; use Lossy"
            exit 1
          fi
      - name: Smoke test
        working-directory: game
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless -s res://tests/smoke_test.gd
      - name: Export Web build
        working-directory: game
        run: |
          mkdir -p ../build/web
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" ../build/web/index.html
          test -f ../build/web/index.wasm
      - name: Install Playwright (pinned) + Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Web render + audio check (the Hunt must draw the city and be audible after a click)
        # Loads the export in headless Chromium (SwiftShader WebGL2) with ?autohunt and fails
        # if the screen centre is near-uniform. Guards the Godot 4.3 nothreads web culling bug
        # (threaded_cull_minimum_instances.web in project.godot) and any similar regression.
        # Then clicks once (autoplay policy on) and fails if the Web Audio output stays silent
        # or the bus graph has a cycle (the "no sound at all on the web" bug).
        timeout-minutes: 8
        run: |
          (cd build/web && python3 -m http.server 8060 > /dev/null 2>&1 &)
          sleep 2
          cd /tmp/pw
          node "$GITHUB_WORKSPACE/.github/scripts/web_render_check.js" http://localhost:8060/index.html "$GITHUB_WORKSPACE/web-render-check"
      - name: Upload render check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-render-check
          path: web-render-check
          if-no-files-found: ignore
      - name: Cache-bust the game data
        # Pages serves everything with max-age=600; give each deploy's .pck its own name so
        # players never run a new index.html against a stale cached .pck (or the reverse).
        working-directory: build/web
        run: |
          v=${GITHUB_SHA::10}
          mv index.pck index-$v.pck
          sed -i "s/\"executable\":\"index\",/\"executable\":\"index\",\"mainPack\":\"index-$v.pck\",/; s/\"index.pck\":/\"index-$v.pck\":/" index.html
          grep -q "\"mainPack\":\"index-$v.pck\"" index.html
          ls -la
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
